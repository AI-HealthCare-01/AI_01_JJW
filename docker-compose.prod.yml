services:
  # 1. Redis (메시지 브로커 및 캐싱)
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - ws
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. API Server (FastAPI + SPA 서빙)
  fastapi:
    container_name: fastapi
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}
    env_file: .env
    volumes:
      - static_volume:/app/static
    restart: always
    networks:
      - ws
    depends_on:
      redis:
        condition: service_healthy

  # 3. AI Worker (Model 추론)
  ai-worker:
    container_name: ai-worker
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}
    env_file: .env
    restart: always
    mem_limit: 4G
    networks:
      - ws
    depends_on:
      redis:
        condition: service_healthy

  # 4. Nginx (리버스 프록시 + SPA 서빙)
  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx/prod_http.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ws
    depends_on:
      - fastapi

  # 5. Certbot (SSL 인증서 자동 갱신)
  certbot:
    image: certbot/certbot
    container_name: certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 48h & wait $${!}; done;'"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - nginx

volumes:
  redis_data:
  static_volume:
  certbot_conf:
  certbot_www:

networks:
  ws:
    driver: bridge
