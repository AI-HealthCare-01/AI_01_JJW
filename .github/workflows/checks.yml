name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run Ruff Check (Linting)
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format . --check

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group app --group dev --frozen

      - name: Create test env file
        run: |
          cat > .env << 'EOF'
          ENV=local
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_DB=0
          JWT_SECRET=test-secret-key-for-ci
          JWT_ALGORITHM=HS256
          TASK_RESULT_TTL=3600
          KAKAO_CLIENT_ID=test_kakao_id
          KAKAO_CLIENT_SECRET=test_kakao_secret
          NAVER_CLIENT_ID=test_naver_id
          NAVER_CLIENT_SECRET=test_naver_secret
          ALLOWED_ORIGINS=["http://localhost"]
          EOF

      - name: Run Tests with Coverage
        run: |
          uv run coverage run -m pytest app/tests
          uv run coverage report -m
